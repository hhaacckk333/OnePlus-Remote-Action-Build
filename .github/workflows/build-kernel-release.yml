name: Build OnePlus Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      op_model:
        description: 'Select the OnePlus kernels to build'
        required: true
        type: choice
        options:
          # OOS16
          - OP15_oos16
        default: OP15_oos16
      ksu_options:
        description: 'Enter KernelSU build json'
        required: true
        type: string
        default: '[{"type":"ksun","hash":"v3.4.2"}]'
      optimize_level:
        description: "Compiler optimization level"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      clean_build:
        description: 'Clean build (no ccache)'
        type: boolean
        default: false
      susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for selected device kernel'
        type: string
        default: ''

jobs:
  set-op-model:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      device_count: ${{ steps.set-matrix.outputs.count }}
      ksu_resolved_hash:    ${{ steps.set-matrix.outputs.ksu_resolved_hash }}
      ksu_options_normalized: ${{ steps.set-matrix.outputs.ksu_options_normalized }}
      susfs_resolved_hash:  ${{ steps.set-matrix.outputs.susfs_resolved_hash }}
    steps:
      - name: 📥 Checkout Code (to access configs/)
        uses: actions/checkout@v6
        with:
          repository: freeza-inc/OnePlus-Remote-Action-Build
          ref: devices
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: ⚙️ Generate build matrix
        id: set-matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HTTP_TIMEOUT: 600
        run: |
          set -euo pipefail
          echo "::group::Matrix generation"

          case "${{ inputs.op_model }}" in
            "OP15_oos16")
              file="configs/sm8850.json"
              jq_filter='.[] | select(.model == "OnePlus 15" and .os_version == "OxygenOS 16")'
              ;;
            *)
              file="configs/devices.json"
              jq_filter='.[] | select(.model == "${{ inputs.op_model }}")'
              ;;
          esac

          raw_matrix=$(jq -c "[$jq_filter]" "$file")

          raw_ksu_options='${{ inputs.ksu_options }}'
          if [[ "$raw_ksu_options" =~ ^\{.*\}$ ]]; then
            normalized_ksu_options="[$raw_ksu_options]"
          elif [[ "$raw_ksu_options" =~ ^\[.*\]$ ]]; then
            normalized_ksu_options="$raw_ksu_options"
          else
            echo "::error::Invalid ksu_options format"
            exit 1
          fi

          resolve_hash() {
            local repo=$1 ref=$2
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$ref"
              return
            fi
            local hash
            hash=$(git ls-remote "https://github.com/$repo.git" "$ref" | awk '{print $1}')
            if [ -n "$hash" ]; then
              echo "$hash"
              return
            fi
            echo "$ref"
          }

          ksu_resolved_hash=$(resolve_hash "KernelSU-Next/KernelSU-Next" "v3.4.2")
          susfs_resolved_hash=$(resolve_hash "WildKernels/susfs4ksu" "gki-android16-6.12")

          matrix=$(echo "$raw_matrix" | jq -c \
            --argjson ksu_options "$normalized_ksu_options" \
            --arg ksu_resolved_hash "$ksu_resolved_hash" \
            --arg susfs_resolved_hash "$susfs_resolved_hash" \
            '[
              .[] as $device |
              $ksu_options[] as $ksu |
              $device + {
                ksu_type: $ksu.type,
                ksu_hash: $ksu.hash,
                ksu_resolved_hash: $ksu_resolved_hash,
                susfs_resolved_hash: $susfs_resolved_hash
              }
            ]')

          count=$(echo "$matrix" | jq '. | length')

          echo "ksu_options_normalized=$normalized_ksu_options" >> "$GITHUB_OUTPUT"
          echo "ksu_resolved_hash=$ksu_resolved_hash" >> "$GITHUB_OUTPUT"
          echo "susfs_resolved_hash=$susfs_resolved_hash" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> matrix.json
          echo "::endgroup::"

      - name: Upload build matrix
        uses: actions/upload-artifact@v7
        with:
          name: build-matrix
          path: matrix.json

  build:
    name: build (${{ matrix.model }}, ${{ matrix.soc }}, ${{ matrix.branch }}, ${{ matrix.manifest }}, ${{ matrix.android_version }}, ${{ matrix.kernel_version }}, ${{ matrix.os_version }}, ${{ matrix.ksu_type }})
    needs: set-op-model
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.set-op-model.outputs.matrix) }}
    steps:
      - name: 🧹 Emergency Disk Cleanup
        if: ${{ matrix.disk_cleanup }}
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/az \
            2>/dev/null || true
          sudo apt-get clean
          sudo journalctl --vacuum-time=1s 2>/dev/null || true

      - name: Install Minimal Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex git make bc libssl-dev zip curl jq python3 patch
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1

      - name: ⚙️ Configure ccache
        if: ${{ inputs.clean_build != true }}
        run: |
          if command -v ccache >/dev/null 2>&1; then
            export CCACHE_DIR="${{ github.workspace }}/.ccache"
            mkdir -p "$CCACHE_DIR"
            ccache -o max_size=1.0G
            ccache -o compression=true
            ccache -o compression_level=3
          fi

      - name: ⚙️ Prepare op_config_json
        id: prepare_config
        shell: bash
        run: |
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' '$m | del(.ksu_type, .ksu_hash, .ksu_resolved_hash, .susfs_resolved_hash)')" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout Code (to access manifests/)
        uses: actions/checkout@v6
        with:
          repository: freeza-inc/OnePlus_KSUN_SUSFS_v1
          ref: main
          sparse-checkout: |
            manifests/
          sparse-checkout-cone-mode: false

      - name: 🛠️ Setup Patch, Spoofed Manager & Dual-Slot Compatibility
        shell: bash
        run: |
          echo "" | base64 -d | sudo tee /usr/local/bin/patch > /dev/null
          sudo chmod +x /usr/local/bin/patch
          echo "✅ Universal patch, spoofed manager & dual-slot wrapper active at /usr/local/bin/patch"

      - name: 🔨 Build Kernel
        id: build
        uses: freeza-inc/OnePlus_KSUN_SUSFS_v1/.github/actions@main
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          ksu_type: ${{ matrix.ksu_type }}
          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}
          susfs_commit_hash_or_branch: ${{ matrix.susfs_resolved_hash }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}

      - name: 📊 Build statistics
        id: build-stat
        if: always()
        run: |
          echo "::group::Build Statistics"
          echo "Device: ${{ matrix.model }}"
          echo "Status: ${{ job.status }}"
          echo "::endgroup::"
