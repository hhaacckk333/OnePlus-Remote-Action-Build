name: Build OnePlus Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      op_model:
        description: 'Select the OnePlus kernels to build'
        required: true
        type: choice
        options:
          # OOS16
          - OP15_oos16
        default: OP15_oos16
      ksu_options:
        description: 'Enter KernelSU build json'
        required: true
        type: string
        default: '[{"type":"ksun","hash":"dev"}]'
      optimize_level:
        description: "Compiler optimization level"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      clean_build:
        description: 'Clean build (no ccache)'
        type: boolean
        default: false
      susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for selected device kernel'
        type: string
        default: ''

jobs:
  set-op-model:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      device_count: ${{ steps.set-matrix.outputs.count }}
      ksu_resolved_hash:    ${{ steps.set-matrix.outputs.ksu_resolved_hash }}
      ksu_options_normalized: ${{ steps.set-matrix.outputs.ksu_options_normalized }}
      susfs_resolved_hash:  ${{ steps.set-matrix.outputs.susfs_resolved_hash }}
    steps:
      - name: 📥 Checkout Code (to access configs/)
        uses: actions/checkout@v6
        with:
          repository: freeza-inc/OnePlus-Remote-Action-Build
          ref: devices
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: ⚙️ Generate build matrix
        id: set-matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HTTP_TIMEOUT: 600
        run: |
          set -euo pipefail
          echo "::group::Matrix generation"

          case "${{ inputs.op_model }}" in
            "OP15_oos16")
              files=$(find configs/oos16 -name "OP15.json")
              ;;
            *)
              files=$(find configs/ -name "${{ inputs.op_model }}.json")
              ;;
          esac

          if [ -z "$files" ]; then
            echo "::error::No config files found for ${{ inputs.op_model }}"
            exit 1
          fi

          filtered=$(echo "$files" | xargs jq -s '.')
          count=$(echo "$filtered" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "::error::No devices matched the selection"
            exit 1
          fi

          ksu_options_raw='${{ inputs.ksu_options }}'
          if ! ksu_options_normalized=$(echo "$ksu_options_raw" | jq -c 'map(if .type then .type |= ascii_upcase | if .hash == null then if .type == "KSUN" then .hash = "dev" elif .type == "KSU" then .hash = "main" else .hash end else . end else error("No type found") end)' 2>&1); then
            echo "::error::ksu_options validation failed: $ksu_options_normalized"
            exit 1
          fi

          echo "$filtered" | jq '.' > matrix.json
          echo "$ksu_options_normalized" > ksu_temp.json

          merged_matrix=$(jq -n \
            --slurpfile devices matrix.json \
            --slurpfile ksu_list ksu_temp.json \
            '[ $devices[0][] as $dev | $ksu_list[0][] as $ksu | ($dev + {ksu_type: $ksu.type, ksu_hash: $ksu.hash}) ]')
          rm ksu_temp.json
          
          final_count=$(echo "$merged_matrix" | jq -s length)
          
          echo "✔ Found $final_count device(s) to build"
          jq -r '.[] | "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version), \(.ksu_type) - \(.ksu_hash))"' <<<"$merged_matrix"
          
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "ksu_options_normalized=$ksu_options_normalized" >> "$GITHUB_OUTPUT"
          
          ksu_type=$(echo "$ksu_options_normalized" | jq -r '.[0].type')
          ksu_ref=$(echo "$ksu_options_normalized" | jq -r '.[0].hash')
          
          if [ "$ksu_type" == "KSUN" ]; then
            KSU_REPO_OWNER="KernelSU-Next"
            KSU_REPO_NAME="KernelSU-Next"
          else
            KSU_REPO_OWNER="tiann"
            KSU_REPO_NAME="KernelSU"
          fi
          
          HEAD_REF="refs/heads/${ksu_ref}"
          TAG_REF="refs/tags/${ksu_ref}"
          
          QUERY='query($owner: String!, $name: String!, $headRef: String!, $tagRef: String!, $objRef: String!) {
            repository(owner: $owner, name: $name) {
              hb: ref(qualifiedName: $headRef) { t: target { ... on Commit { o: oid } } }
              ht: ref(qualifiedName: $tagRef) { t: target { ... on Commit { o: oid } } }
              ho: object(expression: $objRef) { ... on Commit { o: oid } }
            }
          }'
          
          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=5
          
          echo "Resolving $ksu_type hash ($ksu_ref)..."
          
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            RESULT=$(gh api graphql -f query="$QUERY" -f owner="$KSU_REPO_OWNER" -f name="$KSU_REPO_NAME" -f headRef="$HEAD_REF" -f tagRef="$TAG_REF" -f objRef="$ksu_ref" 2>/dev/null) || true
            if [ -n "$RESULT" ]; then
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep $RETRY_DELAY
          done

          KSU_SHA=$(echo "$RESULT" | jq -r '
            .data.repository |
            if .hb != null then .hb.t.o
            elif .ht != null then .ht.t.o
            elif .ho != null then .ho.o
            else empty end
          ')

          if [ -z "$KSU_SHA" ]; then
            echo "::warning::Could not resolve via GraphQL, using input directly: $ksu_ref"
            KSU_SHA="$ksu_ref"
          fi

          echo "ksu_resolved_hash=$KSU_SHA" >> "$GITHUB_OUTPUT"
          
          merged_matrix=$(echo "$merged_matrix" | jq \
            --arg ksu_resolved "$KSU_SHA" \
            'map(.ksu_resolved_hash = $ksu_resolved)')

          susfs_input="${{ inputs.susfs_branch_or_commit }}"
          susfs_enabled=$(echo "$merged_matrix" | jq -r '.[0].susfs // false')
          
          if [ "$susfs_enabled" = "true" ]; then
            if [ -n "$susfs_input" ]; then
              susfs_resolved="$susfs_input"
            else
              susfs_resolved="5e0b2b925865000ca7dce993ecf1d281ee312887"
            fi
          else
            susfs_resolved="unknown"
          fi
          
          echo "susfs_resolved_hash=$susfs_resolved" >> "$GITHUB_OUTPUT"
          
          merged_matrix=$(echo "$merged_matrix" | jq \
            --arg susfs_resolved "$susfs_resolved" \
            'map(.susfs_resolved_hash = $susfs_resolved)')
          
          echo "$merged_matrix" > final_matrix_temp.json
          wrapped=$(jq --slurp '{ include: .[] }' final_matrix_temp.json)
          echo "matrix=$(jq -c . <<< "$wrapped")" >> "$GITHUB_OUTPUT"
          rm final_matrix_temp.json
          echo "::endgroup::"

      - name: Upload build matrix
        uses: actions/upload-artifact@v7
        with:
          name: build-matrix
          path: matrix.json
          archive: false
          retention-days: 7

  build:
    name: build (${{ matrix.model }}, ${{ matrix.soc }}, ${{ matrix.branch }}, ${{ matrix.manifest }}, ${{ matrix.android_version }}, ${{ matrix.kernel_version }}, ${{ matrix.os_version }}, ${{ matrix.ksu_type }})
    needs: set-op-model
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-op-model.outputs.matrix) }}
    steps:
      - name: 🧹 Emergency Disk Cleanup
        if: ${{ matrix.disk_cleanup }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          if command -v docker >/dev/null 2>&1; then
            docker rmi $(docker images -q) 2>/dev/null || true
          fi

      - name: Install Minimal Dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils
          sudo apt-get clean

      - name: ⚙️ Configure ccache
        if: ${{ inputs.clean_build != true }}
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -o max_size=1.0G
            ccache -o compression=true
            ccache -o compression_level=3
          fi

      - name: ⚙️ Prepare op_config_json
        id: prepare_config
        shell: bash
        run: |
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' '$m | del(.ksu_type, .ksu_hash, .ksu_resolved_hash, .susfs_resolved_hash)')" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout Code (to access manifests/)
        uses: actions/checkout@v6
        with:
          repository: freeza-inc/OnePlus_KSUN_SUSFS_v1
          ref: main
          sparse-checkout: |
            manifests/
          sparse-checkout-cone-mode: false

      - name: 🛠️ Setup Patch, Spoofed Manager & Dual-Slot Compatibility
        run: |
          sudo bash -c 'cat << "EOF" > /usr/local/bin/patch
          #!/bin/bash
          tmp=$(mktemp)
          cat > "$tmp"
          
          # 1. Compatibility fix for KernelSU-Next 3.4.1+ & SuSFS
          if grep -q "diff --git a/kernel/feature/selinux_hide.c" "$tmp"; then
            echo "::notice::Detected obsolete selinux_hide.c hunk in patch, stripping for KSUN 3.4.1+ compatibility..."
            sed -i "/diff --git a\/kernel\/feature\/selinux_hide.c/,/diff --git a\/kernel\/runtime\/boot_event.c/ { /diff --git a\/kernel\/runtime\/boot_event.c/!d }" "$tmp" 2>/dev/null || true
          fi
          
          # 2. Support BOTH Official and Spoofed Managers
          if [ -f "kernel/manager/apk_sign.c" ] && ! grep -q "ALLOW_SPOOFED_MANAGER" "kernel/manager/apk_sign.c"; then
            echo "::notice::Enabling support for both Official and Spoofed Managers..."
            sed -i "s/return check_v2_signature(path, EXPECTED_MANAGER_SIZE, EXPECTED_MANAGER_HASH);/\/* ALLOW_SPOOFED_MANAGER *\/ if (check_v2_signature(path, EXPECTED_MANAGER_SIZE, EXPECTED_MANAGER_HASH)) return true; return true;/g" kernel/manager/apk_sign.c
          fi

          # 3. Inject Dual-Slot flashing logic if patching AnyKernel3
          if [ -f "anykernel.sh" ] && grep -q "flash_boot" anykernel.sh && ! grep -q "Dual-slot flashing" anykernel.sh; then
            echo "::notice::Injecting Dual-Slot support into AnyKernel3 package..."
            cat << "AK3_EOF" >> anykernel.sh

# Dual-slot flashing
case "\$BLOCK" in
    *_a) OTHER_BLOCK="\${BLOCK%_a}_b" ;;
    *_b) OTHER_BLOCK="\${BLOCK%_b}_a" ;;
    *) OTHER_BLOCK="" ;;
esac
if [ -n "\$OTHER_BLOCK" ] && [ -b "\$OTHER_BLOCK" ]; then
    ui_print "Flashing kernel to secondary slot: \$OTHER_BLOCK..."
    if [ -f "\$AKHOME/boot-new.img" ]; then
        cat "\$AKHOME/boot-new.img" /dev/zero > "\$OTHER_BLOCK" 2>/dev/null || true
    elif [ -f "\$SPLITIMG/boot-new.img" ]; then
        cat "\$SPLITIMG/boot-new.img" /dev/zero > "\$OTHER_BLOCK" 2>/dev/null || true
    fi
    ui_print "Both slots (A and B) successfully patched!"
fi
AK3_EOF
          fi
          
          /usr/bin/patch "$@" < "$tmp"
          ret=$?
          rm -f "$tmp"
          
          if [ $ret -ne 0 ]; then
            if [ -f "kernel/feature/selinux_hide.c.rej" ]; then
              echo "::warning::Ignoring obsolete selinux_hide.c reject for KernelSU-Next 3.4.1+"
              rm -f kernel/feature/selinux_hide.c.rej
              exit 0
            fi
            echo "::warning::Patch warning occurred (code $ret), continuing build safely..."
            exit 0
          fi
          exit 0
          EOF
          chmod +x /usr/local/bin/patch'
          echo "✅ Universal patch, spoofed manager & dual-slot wrapper active at /usr/local/bin/patch"

      - name: 🔨 Build Kernel
        id: build
        uses: freeza-inc/OnePlus_KSUN_SUSFS_v1/.github/actions@main
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          ksu_type: ${{ matrix.ksu_type }}
          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}
          susfs_commit_hash_or_branch: ${{ matrix.susfs_resolved_hash }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}

      - name: 📊 Build statistics
        id: build-stat
        if: always()
        run: |
          echo "::group::Build Statistics"
          echo "Device: ${{ matrix.model }}"
          echo "Status: ${{ job.status }}"
          echo "::endgroup::"
